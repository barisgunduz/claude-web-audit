name: Feature request
description: Suggest a change or a new check
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need that the tool does not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool do? Check SCOPE.md first, because some items are out of scope.
    validations:
      required: true
