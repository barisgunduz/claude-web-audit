name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect and what did you get?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command, with the domain changed if it is private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cwa --version`.
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Paste the output. Remove any API key first.
      render: text
